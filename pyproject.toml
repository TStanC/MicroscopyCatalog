[project]
name = "microscopy-catalog"
version = "2.0.0"
description = "Read-only catalog of microscopy datasets (Bio-Formats metadata, previews, comments) with a local web server"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[tool.uv]
# not an installable package: the scripts run from the program folder
package = false
